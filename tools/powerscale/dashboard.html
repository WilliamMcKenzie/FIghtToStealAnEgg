<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powerscaling Control</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --line: #e4e3df; --grid: #ecebe7;
  --ink: #0b0b0b; --ink2: #52514e; --ink3: #8a8984;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --accent: #2a78d6; --good: #0ca30c; --bad: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --line: #33332f; --grid: #2a2a27;
    --ink: #f0efec; --ink2: #c3c2b7; --ink3: #8d8c84;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --accent: #3987e5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: .2px; }
header .grow { flex: 1; }
#status { color: var(--ink2); font-size: 13px; }
button { font: inherit; border: 1px solid var(--line); background: var(--raised); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--ink3); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
button.primary:disabled { opacity: .45; cursor: default; }
button.small { padding: 3px 8px; font-size: 12px; }
.layout { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 54px); }
nav { border-right: 1px solid var(--line); padding: 14px 10px; background: var(--surface); }
nav a { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 8px; color: var(--ink2); text-decoration: none; font-weight: 600; cursor: pointer; }
nav a.on { background: var(--page); color: var(--ink); }
nav a .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--s2); align-self: center; }
nav p { color: var(--ink3); font-size: 12px; margin: 16px 10px 0; }
main { padding: 18px 20px 60px; max-width: 1180px; }
main > p.intro { color: var(--ink2); margin: 0 0 14px; max-width: 760px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 2px; }
.card .note { color: var(--ink2); font-size: 13px; margin: 0 0 10px; max-width: 820px; }
.card .changed { color: var(--s2); font-weight: 700; font-size: 12px; margin-left: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; }
.controls { display: flex; flex-direction: column; gap: 9px; font-size: 13px; }
.controls label { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--ink2); }
.controls input[type=number], .controls select { width: 120px; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); color: var(--ink); }
.controls input[type=range] { width: 100%; }
.card > .controls { max-width: 420px; }
.controls .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.controls .hint { color: var(--ink3); font-size: 12px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 300px; overflow: visible; }
.chart text { fill: var(--ink3); font-size: 11px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); margin: 4px 0 0 4px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--ink3) 0 4px, transparent 4px 7px) !important; }
.tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 3; }
.tip b { color: var(--ink); }
.tip span { color: var(--ink2); }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--ink2); font-size: 13px; font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 8px; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th { color: var(--ink3); font-weight: 600; }
td input { width: 110px; text-align: right; font: inherit; padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--raised); color: var(--ink); }
.chip { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.up { color: var(--good); } .down { color: var(--bad); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 10px; font-weight: 600; display: none; z-index: 9; max-width: 90vw; }
.assume { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 10px; font-size: 12.5px; color: var(--ink2); }
.assume input { width: 90px; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  nav p { display: none; }
  .row { grid-template-columns: 1fr; }
  main { padding: 14px 16px 60px; }
}
</style>
</head>
<body>
<header>
  <h1>Powerscaling Control</h1>
  <span id="status">Loading Config…</span>
  <span class="grow"></span>
  <button id="resetAll">Undo all</button>
  <button id="save" class="primary" disabled>Save to game</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// ---------------------------------------------------------------- data in
let CFG = null;        // the tree as the game has it now
let PATHS = {};        // path -> "number" | "string": values that can be written
let VERSION = "";
const EDIT = {};       // path -> new value (only what's changed)
let page = "Weapons";

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};
const getPath = (tree, path) => path.split(".").reduce((t, k) => (t == null ? undefined : Array.isArray(t) ? t[+k - 1] : t[k]), tree);
const saved = (path) => getPath(CFG, path);
const cur = (path) => (path in EDIT ? EDIT[path] : saved(path));
function setVal(path, v) {
  if (!(path in PATHS)) return;
  if (v === saved(path) || (typeof v === "number" && Math.abs(v - saved(path)) < 1e-9 * Math.max(1, Math.abs(v)))) delete EDIT[path];
  else EDIT[path] = v;
  refreshStatus();
}

// ---------------------------------------------------------------- numbers
function abbr(v) {
  if (v == null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  const units = [[1e15, "Qd"], [1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]];
  for (const [n, s] of units) if (a >= n) return trim(v / n) + s;
  return trim(v);
}
function trim(v) {
  const a = Math.abs(v);
  const d = a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3;
  return (+v.toFixed(d)).toString();
}
function sig(v, n) {
  if (!v) return 0;
  const p = Math.pow(10, n - 1 - Math.floor(Math.log10(Math.abs(v))));
  return Math.round(v * p) / p;
}
const pct = (a, b) => (b ? (a / b - 1) * 100 : 0);
function hexOf(expr) {
  if (!expr || !expr.expr) return null;
  let m = expr.expr.match(/fromHex\("#?([0-9a-fA-F]{6})"\)/);
  if (m) return "#" + m[1];
  m = expr.expr.match(/fromRGB\((\d+),\s*(\d+),\s*(\d+)\)/);
  if (m) return "#" + [m[1], m[2], m[3]].map((x) => (+x).toString(16).padStart(2, "0")).join("");
  m = expr.expr.match(/Color3\.new\(([\d.]+),\s*([\d.]+),\s*([\d.]+)\)/);
  if (m) return "#" + [m[1], m[2], m[3]].map((x) => Math.round(+x * 255).toString(16).padStart(2, "0")).join("");
  return null;
}

// ---------------------------------------------------------------- game rules (mirrors of the Luau)
const RARITIES = () => Object.keys(CFG.Rarities || {});
const rarityColor = (r) => hexOf((CFG.Rarities[r] || {}).text) || "#888";
const TIERS = [["Meadow"], ["Desert"], ["Ice"], ["Lava"], ["Dungeon", "Forest"], ["Castle", "Ocean"]];
const biomeName = (b) => (CFG.Regions.Names || {})[b] || b;
const tierName = (t) => t.map(biomeName).join(" / ");
const biomeColor = (b) => hexOf((CFG.Index.Tint || {})[b]) || "#888";

function powerCurve(S, P) {
  const x = Math.max(S || 0, 0) / P.Scale;
  if (P.Curve === "Power") return Math.pow(x, P.Exponent ?? 0.5);
  if (P.Curve === "Linear") return x;
  if (P.Curve === "Exp") return 1 - Math.exp(-x);
  return Math.log(1 + x);
}
const powerP = (get) => ({ Scale: get("Power.Scale"), Damage: get("Power.Damage"), Speed: get("Power.Speed"), MaxSpeed: get("Power.MaxSpeed"), Curve: get("Power.Curve") || "Log", Exponent: get("Power.Exponent") });
const pDamage = (S, P) => 1 + P.Damage * powerCurve(S, P);
const pSpeed = (S, P) => Math.min(1 + P.Speed * powerCurve(S, P), P.MaxSpeed);

function rideSpeed(mult, T) {
  if (mult <= 1) return T.MountSpeed * mult;
  const span = T.MaxSpeed - T.MountSpeed;
  let t;
  if (T.SpeedCurve === "Linear") t = (mult - 1) / (T.TopSpeed - 1);
  else if (T.SpeedCurve === "Power") t = Math.pow((mult - 1) / (T.TopSpeed - 1), T.SpeedExponent ?? 0.5);
  else t = Math.log(mult) / Math.log(T.TopSpeed);
  return Math.min(T.MountSpeed + span * t, T.MaxSpeed);
}
const speedT = (get) => ({ MountSpeed: get("PetStats.MountSpeed"), MaxSpeed: get("PetStats.MaxSpeed"), TopSpeed: get("PetStats.TopSpeed"), SpeedCurve: get("PetStats.SpeedCurve") || "Log", SpeedExponent: get("PetStats.SpeedExponent") });

function weaponCool(id) {
  const w = CFG.Weapons[id];
  if (w.Type === "Melee") return (w.Slash && w.Slash.Cooldown) || CFG.Slash.Cooldown;
  return (w.Shot && w.Shot.Cooldown) || (CFG.Shots[w.Type] || {}).Cooldown || 0.6;
}
function weaponCount(id) {
  const w = CFG.Weapons[id];
  if (w.Type === "Melee") return 1;
  return (w.Shot && w.Shot.Count) || (CFG.Shots[w.Type] || {}).Count || 1;
}
const weaponIds = () => Object.keys(CFG.Weapons).filter((k) => CFG.Weapons[k] && CFG.Weapons[k].Name).sort((a, b) => (CFG.Weapons[a].Price || 0) - (CFG.Weapons[b].Price || 0) || a.localeCompare(b));
// damage a second at 0 Strength: Slash.Damage x the weapon's Damage x its shots / its cooldown
const weaponDps = (id, get) => get("Slash.Damage") * get(`Weapons.${id}.Damage`) * weaponCount(id) / weaponCool(id);

function petBiome(kind) {
  for (const [b, kinds] of Object.entries(CFG.Eggs.Kinds)) if (kinds[kind] != null) return b;
  return kind === "Horse" ? "Starter" : "No egg";
}
function bossPaths(boss, leaf) {
  const pre = `Bosses.${boss}.`;
  return Object.keys(PATHS).filter((p) => p.startsWith(pre) && p.endsWith("." + leaf));
}
const tierBosses = (t) => t.flatMap((b) => (CFG.BossPools[b] || []).filter((x) => CFG.Bosses[x]));

// ---------------------------------------------------------------- curve presets (for lists)
const PRESETS = {
  hand: { name: "As is" },
  linear: { name: "Linear", rate: "Added per step", f: (i, a, r) => a + r * i,
    fit: (ys) => { const n = ys.length, xs = ys.map((_, i) => i); const [m, c] = lsq(xs, ys); return [c, m]; } },
  exp: { name: "Exponential", rate: "Times per step", f: (i, a, r) => a * Math.pow(r, i),
    fit: (ys) => { const xs = ys.map((_, i) => i), ls = ys.map((y) => Math.log(Math.max(y, 1e-9))); const [m, c] = lsq(xs, ls); return [Math.exp(c), Math.exp(m)]; } },
  log: { name: "Logarithmic", rate: "Growth (x ln(1+step))", f: (i, a, r) => a + r * Math.log(1 + i),
    fit: (ys) => { const xs = ys.map((_, i) => Math.log(1 + i)); const [m, c] = lsq(xs, ys); return [c, m]; } },
  poly: { name: "Polynomial", rate: "Power (1 = linear)", f: (i, a, r) => a * Math.pow(1 + i, r),
    fit: (ys) => { const xs = ys.map((_, i) => Math.log(1 + i)), ls = ys.map((y) => Math.log(Math.max(y, 1e-9))); const [m, c] = lsq(xs, ls); return [Math.exp(c), m]; } },
};
function lsq(xs, ys) {
  const n = xs.length; if (n < 2) return [0, ys[0] || 0];
  const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let sxy = 0, sxx = 0;
  for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; }
  const m = sxx ? sxy / sxx : 0;
  return [m, my - m * mx];
}

// ---------------------------------------------------------------- what's on each page
// A list: one value per item (weapon, pet, region...). item.targets are the Config values it
// writes; with more than one, each is scaled by the same ratio (so a region's 3 bosses keep
// their differences). A formula: Config parameters drawn as a curve.
function lists() {
  const get = (p) => cur(p);
  const weapons = weaponIds();
  return {
    weaponDps: {
      page: "Weapons", title: "Weapon damage per second", unit: "dps at 0 Strength", log: true, sig: 3,
      note: "Each weapon in price order. DPS = Slash damage x the weapon's Damage x shots / cooldown; changing a point changes its Damage (cooldown and shots stay).",
      items: weapons.map((id) => ({ label: CFG.Weapons[id].Name, tag: CFG.Weapons[id].Rarity, color: rarityColor(CFG.Weapons[id].Rarity),
        read: (g) => weaponDps(id, g), targets: [`Weapons.${id}.Damage`] })),
    },
    weaponPrice: {
      page: "Weapons", title: "Weapon prices", unit: "cash", log: true, sig: 2,
      note: "What Carl sells each weapon for, cheapest first (the Kendo Stick is free).",
      items: weapons.filter((id) => CFG.Weapons[id].Price != null).map((id) => ({ label: CFG.Weapons[id].Name, tag: CFG.Weapons[id].Rarity,
        color: rarityColor(CFG.Weapons[id].Rarity), targets: [`Weapons.${id}.Price`] })),
    },
    petCash: {
      page: "Pets", title: "Pet cash per second", unit: "cash/s", log: true, sig: 2,
      note: "Every pet from lowest to highest earner. Pen pets (up to 5) pay this every second; it's the game's main income.",
      items: Object.keys(CFG.Pets).sort((a, b) => CFG.Pets[a].Cash - CFG.Pets[b].Cash || a.localeCompare(b))
        .map((k) => ({ label: k.replace(/(\p{Ll})(\p{Lu})/gu, "$1 $2"), tag: CFG.Pets[k].Rarity + " · " + biomeName(petBiome(k)), color: rarityColor(CFG.Pets[k].Rarity), targets: [`Pets.${k}.Cash`] })),
    },
    petHealth: {
      page: "Pets", title: "Pet health by rarity", unit: "health", log: false, sig: 3,
      note: "Base health of each rarity. A pet's own health is this x its Lean (more health, less speed) x its size.",
      items: RARITIES().filter((r) => CFG.PetStats.Rarity[r]).map((r) => ({ label: r, color: rarityColor(r), targets: [`PetStats.Rarity.${r}.Health`] })),
    },
    petSpeedMult: {
      page: "Pets", title: "Pet speed multipliers", unit: "x the Horse", log: false, sig: 3,
      note: "Each pet's Speed (LassoAPet's multiplier, the Horse is 1), slowest to fastest. The ride-speed curve below turns it into studs a second.",
      items: Object.keys(CFG.Pets).filter((k) => CFG.Pets[k].Speed != null).sort((a, b) => CFG.Pets[a].Speed - CFG.Pets[b].Speed || a.localeCompare(b))
        .map((k) => ({ label: k.replace(/(\p{Ll})(\p{Lu})/gu, "$1 $2"), tag: CFG.Pets[k].Rarity, color: rarityColor(CFG.Pets[k].Rarity), targets: [`Pets.${k}.Speed`] })),
    },
    indexPower: {
      page: "Strength", title: "Index reward Strength by rarity", unit: "Strength", log: true, sig: 2,
      note: "Strength you get for claiming a pet in the Index, by its rarity.",
      items: RARITIES().filter((r) => CFG.Index.Power[r] != null).map((r) => ({ label: r, color: rarityColor(r), targets: [`Index.Power.${r}`] })),
    },
    groundCost: {
      page: "Training", title: "Training ground prices", unit: "cash", log: true, sig: 2,
      items: Object.keys(CFG.Training.Grounds).map((g) => ({ label: biomeName(g), color: biomeColor(g), targets: [`Training.Grounds.${g}.Cost`] })),
    },
    groundHealth: {
      page: "Training", title: "Training mob health", unit: "health", log: true, sig: 2,
      items: Object.keys(CFG.Training.Grounds).map((g) => ({ label: biomeName(g), color: biomeColor(g), targets: [`Training.Grounds.${g}.Health`] })),
    },
    groundStrength: {
      page: "Training", title: "Training mob Strength (gain multiplier)", unit: "x gain", log: false, sig: 3,
      note: "Strength per hit = damage dealt x this x Training.PerDamage.",
      items: Object.keys(CFG.Training.Grounds).map((g) => ({ label: biomeName(g), color: biomeColor(g), targets: [`Training.Grounds.${g}.Strength`] })),
    },
    bossHealth: {
      page: "Bosses", title: "Boss health by region", unit: "health", log: true, sig: 2,
      note: "Every boss in a region (both sides of the fork share a step). A region whose bosses differ keeps their differences: all scale together.",
      items: TIERS.map((t) => ({ label: tierName(t), color: biomeColor(t[0]), targets: tierBosses(t).map((b) => `Bosses.${b}.Health`).filter((p) => p in PATHS) })),
    },
    bossDamage: {
      page: "Bosses", title: "Boss hit damage by region", unit: "damage (biggest hit)", log: true, sig: 2,
      note: "The biggest hit among the region's bosses. Changing it scales every attack, orb and minion hit of every boss there by the same amount.",
      items: TIERS.map((t) => ({ label: tierName(t), color: biomeColor(t[0]), targets: tierBosses(t).flatMap((b) => bossPaths(b, "Damage")),
        read: (g) => Math.max(...tierBosses(t).flatMap((b) => bossPaths(b, "Damage").map(g))) })),
    },
    regionCost: {
      page: "Economy", title: "Region prices", unit: "cash", log: true, sig: 2,
      note: "What each region's blocker costs. Bosses pay a share of the next one (Boss bounty below).",
      items: TIERS.slice(1).map((t) => ({ label: tierName(t), color: biomeColor(t[0]), targets: t.map((b) => `Regions.Cost.${b}`).filter((p) => p in PATHS) })),
    },
    eggReward: {
      page: "Economy", title: "Egg reward by region", unit: "cash", log: true, sig: 2,
      items: TIERS.map((t) => ({ label: tierName(t), color: biomeColor(t[0]), targets: t.map((b) => `Eggs.Reward.${b}`).filter((p) => p in PATHS) })),
    },
    nestCooldown: {
      page: "Economy", title: "Nest refill time by region", unit: "seconds", log: false, sig: 3,
      items: TIERS.map((t) => ({ label: tierName(t), color: biomeColor(t[0]), targets: t.map((b) => `Eggs.Cooldown.${b}`).filter((p) => p in PATHS) })),
    },
  };
}

function formulas() {
  return {
    strengthDamage: {
      page: "Strength", title: "Strength → damage", unit: "x damage", xLog: true, xMax: 1e7, xLabel: "Strength",
      note: "How much Strength multiplies your damage (Shared/Power). Curve shapes: Logarithmic keeps growing slower and slower, Power is (Strength / Scale) ^ Exponent, Exponential rises fast then levels off at 1 + Damage.",
      params: [
        { path: "Power.Curve", label: "Curve", options: { Log: "Logarithmic", Power: "Power / polynomial", Linear: "Linear", Exp: "Exponential (levels off)" } },
        { path: "Power.Scale", label: "Scale (Strength per step)", step: 1 },
        { path: "Power.Damage", label: "Damage growth", step: 0.01 },
        { path: "Power.Exponent", label: "Exponent (Power curve)", step: 0.05 },
      ],
      f: (S, g) => pDamage(S, powerP(g)),
      marks: [0, 200, 1000, 18000, 140000, 1e6],
    },
    strengthSpeed: {
      page: "Strength", title: "Strength → attack speed", unit: "x faster", xLog: true, xMax: 1e7, xLabel: "Strength",
      note: "Same curve shape and Scale as damage (above); attacks come this many times faster, up to the cap.",
      params: [
        { path: "Power.Speed", label: "Speed growth", step: 0.002 },
        { path: "Power.MaxSpeed", label: "Cap", step: 0.05 },
      ],
      f: (S, g) => pSpeed(S, powerP(g)),
      marks: [0, 200, 1000, 18000, 140000, 1e6],
    },
    petSpeed: {
      page: "Pets", title: "Ride speed curve", unit: "studs/s", xMax: 10.5, xLabel: "Speed multiplier",
      note: "A pet's Speed multiplier to studs a second. Up to the Horse's 1 it's MountSpeed x Speed; above it the curve climbs to the cap at the top multiplier. Dots are the pets.",
      params: [
        { path: "PetStats.SpeedCurve", label: "Curve", options: { Log: "Logarithmic", Power: "Power / polynomial", Linear: "Linear" } },
        { path: "PetStats.MountSpeed", label: "Horse speed (studs/s)", step: 1 },
        { path: "PetStats.MaxSpeed", label: "Cap (studs/s)", step: 5 },
        { path: "PetStats.TopSpeed", label: "Multiplier that hits the cap", step: 0.5 },
        { path: "PetStats.SpeedExponent", label: "Exponent (Power curve)", step: 0.05 },
      ],
      f: (m, g) => rideSpeed(m, speedT(g)),

// ---------------------------------------------------------------- list state
// per list: { preset, a, r, round } (the generator's settings while not hand-tuned)
const GEN = {};
function usable(L) {

}
function listSaved(L) {

}
function setItem(L, i, v) {
  const it = L.items[i];
  const old = it.read ? it.read(saved) : saved(it.targets[0]);
  const ratio = old ? v / old : 1;
  for (const p of it.targets) {
    let nv = old ? saved(p) * ratio : v;
    const base = saved(p);
    // keep integers integers, and other numbers to a sensible precision
    nv = Number.isInteger(base) && Math.abs(nv) >= 10 ? Math.round(nv) : sig(nv, 4);
    setVal(p, nv);
  }
}
function applyGen(key, L) {
  const g = GEN[key];
  if (!g || g.preset === "hand") return;
  const P = PRESETS[g.preset];
  L.items.forEach((_, i) => {
    let v = P.f(i, g.a, g.r);
    if (g.round) v = sig(v, L.sig);
    setItem(L, i, Math.max(v, 0));

// ---------------------------------------------------------------- the chart (SVG)
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((x) => span / x <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toPrecision(12));
  return out;
}
function logTicks(lo, hi) {
  const out = []; for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) out.push(Math.pow(10, e));
  return out.filter((v) => v >= lo * 0.999 && v <= hi * 1.001);
}
// opts: { series: [{ name, color, pts:[{x,y,label}], dash, dots, line, drag }], xCat: [labels] | null,
//         xLog, yLog, unit, xLabel, onDrag(i, y) }
function drawChart(box, opts) {
  box.innerHTML = "";
  const W = Math.max(box.clientWidth || 700, 300), H = 300, m = { l: 56, r: 14, t: 12, b: opts.xCat ? 64 : 34 };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opts.title || "" });
  svg.style.height = H + "px";
  const all = opts.series.flatMap((se) => se.pts).filter((p) => isFinite(p.y));
  let ys = all.map((p) => p.y);
  if (opts.yLog) ys = ys.filter((y) => y > 0);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (!opts.yLog) { y0 = Math.min(0, y0); y1 = y1 * 1.08 || 1; }
  else { y0 = Math.pow(10, Math.floor(Math.log10(y0 || 1))); y1 = Math.pow(10, Math.ceil(Math.log10(y1 || 10))); if (y1 <= y0) y1 = y0 * 10; }
  const fy = opts.yLog ? (v) => Math.log10(Math.max(v, y0)) : (v) => v;
  const Y = (v) => m.t + (H - m.t - m.b) * (1 - (fy(v) - fy(y0)) / (fy(y1) - fy(y0) || 1));
  let X, xs;
  if (opts.xCat) {
    const n = opts.xCat.length, bw = (W - m.l - m.r) / n;
    X = (i) => m.l + bw * (i + 0.5);
  } else {
    xs = all.map((p) => p.x);
    const x0 = 0, x1 = opts.xMax || Math.max(...xs);
    const fx = opts.xLog ? (v) => Math.log10(1 + Math.max(v, 0)) : (v) => v;
    X = (v) => m.l + (W - m.l - m.r) * (fx(v) - fx(x0)) / (fx(x1) - fx(x0) || 1);
    const ticks = opts.xLog ? [0, ...logTicks(10, x1)] : niceTicks(x0, x1, 6);
    for (const t of ticks) {
      svg.append(s("line", { x1: X(t), x2: X(t), y1: H - m.b, y2: H - m.b + 4, stroke: "var(--ink3)" }));
      const tx = s("text", { x: X(t), y: H - m.b + 16, "text-anchor": "middle" }); tx.textContent = abbr(t); svg.append(tx);
    }
    if (opts.xLabel) { const tx = s("text", { x: W - m.r, y: H - 2, "text-anchor": "end" }); tx.textContent = opts.xLabel; svg.append(tx); }
  }
  // y grid
  const yt = opts.yLog ? logTicks(y0, y1) : niceTicks(y0, y1, 5);
  for (const t of yt) {
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: "var(--grid)" }));
    const tx = s("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }); tx.textContent = abbr(t); svg.append(tx);
  }
  svg.append(s("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: "var(--ink3)" }));
  if (opts.xCat) {
    const n = opts.xCat.length, every = Math.ceil(n / Math.max(1, Math.floor((W - m.l) / 26)));
    opts.xCat.forEach((lab, i) => {
      if (i % every) return;
      const tx = s("text", { x: X(i), y: H - m.b + 12, "text-anchor": "end", transform: `rotate(-38 ${X(i)} ${H - m.b + 12})` });
      tx.textContent = lab.length > 16 ? lab.slice(0, 15) + "…" : lab; svg.append(tx);
    });
  }
  const px = (p, i) => (opts.xCat ? X(i) : X(p.x));
  // marks
  for (const se of opts.series) {
    const pts = se.pts.map((p, i) => [px(p, i), Y(p.y), p, i]).filter((q) => isFinite(q[1]) && (!opts.yLog || q[2].y > 0));
    if (se.line !== false && pts.length > 1) {
      svg.append(s("path", { d: "M" + pts.map((q) => q[0].toFixed(1) + "," + q[1].toFixed(1)).join("L"), fill: "none", stroke: se.color, "stroke-width": 2,
        "stroke-dasharray": se.dash ? "4 3" : "none", "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    if (se.dots) for (const [x, y, p, i] of pts) {
      const c = s("circle", { cx: x, cy: y, r: se.drag ? 5 : 4, fill: se.color, stroke: "var(--surface)", "stroke-width": 2 });
      if (se.drag) {
        c.style.cursor = "ns-resize";
        c.addEventListener("pointerdown", (e) => {
          e.preventDefault(); c.setPointerCapture(e.pointerId);
          const rect = svg.getBoundingClientRect(), k = H / rect.height;
          const move = (ev) => {
            const yy = Math.min(Math.max((ev.clientY - rect.top) * k, m.t), H - m.b);
            const f = 1 - (yy - m.t) / (H - m.t - m.b), fv = fy(y0) + f * (fy(y1) - fy(y0));
            c.setAttribute("cy", yy);
            c._v = opts.yLog ? Math.pow(10, fv) : fv;
            showTip(ev, `<b>${p.label}</b><br><span>${abbr(c._v)}</span>`);
          };
          const up = () => { c.removeEventListener("pointermove", move); c.removeEventListener("pointerup", up); hideTip(); if (c._v != null) opts.onDrag(i, c._v); };
          c.addEventListener("pointermove", move); c.addEventListener("pointerup", up);
        });
      }
      svg.append(c);
    }
  }
  // hover: nearest x, every series' value there
  const tip = h("div", { class: "tip" });
  const showTip = (ev, html) => { const r = box.getBoundingClientRect(); tip.innerHTML = html; tip.style.display = "block";
    let left = ev.clientX - r.left + 14; if (left > r.width - 180) left = ev.clientX - r.left - 190; tip.style.left = left + "px"; tip.style.top = (ev.clientY - r.top - 10) + "px"; };
  const hideTip = () => (tip.style.display = "none");
  const cross = s("line", { y1: m.t, y2: H - m.b, stroke: "var(--ink3)", "stroke-dasharray": "2 3", visibility: "hidden" });
  svg.append(cross);
  svg.addEventListener("pointermove", (ev) => {
    if (ev.buttons) return;
    const rect = svg.getBoundingClientRect(), x = (ev.clientX - rect.left) * (W / rect.width);
    let best = null;
    for (const se of opts.series) se.pts.forEach((p, i) => { const d = Math.abs(px(p, i) - x); if (isFinite(p.y) && (!best || d < best.d - 0.5)) best = { d, i, p, x: px(p, i) }; });
    if (!best || best.d > 40) { hideTip(); cross.setAttribute("visibility", "hidden"); return; }
    cross.setAttribute("x1", best.x); cross.setAttribute("x2", best.x); cross.setAttribute("visibility", "visible");
    const rows = opts.series.map((se) => {
      const q = opts.xCat ? se.pts[best.i] : se.pts.reduce((a, b) => (Math.abs(px(b) - best.x) < Math.abs(px(a) - best.x) ? b : a), se.pts[0]);
      if (!q || (!opts.xCat && Math.abs(px(q) - best.x) > 6)) return "";
      return `<div><span class="chip" style="background:${se.color}"></span><span>${se.name}${!opts.xCat && q.label ? " · " + q.label : ""}: </span><b>${abbr(q.y)}</b></div>`;
    }).join("");
    const head = opts.xCat ? opts.xCat[best.i] : `${opts.xLabel || "x"} ${abbr(best.p.x)}`;
    showTip(ev, `<b>${head}</b>${rows}`);
  });
  svg.addEventListener("pointerleave", () => { hideTip(); cross.setAttribute("visibility", "hidden"); });
  box.append(svg, tip);
  const lg = h("div", { class: "legend" });
  for (const se of opts.series) if (se.name) lg.append(h("span", {}, h("i", { class: se.dash ? "dash" : "", style: `background:${se.color}` }), se.name));
  box.append(lg);
}

// ---------------------------------------------------------------- cards
function listCard(key, L) {
  const card = h("section", { class: "card" });
  const vals = listValues(L), old = listSaved(L);
  const changed = vals.some((v, i) => Math.abs(v - old[i]) > 1e-9 * Math.max(1, Math.abs(old[i])));
  card.append(h("h2", {}, L.title, changed ? h("span", { class: "changed" }, "edited") : null));
  if (L.note) card.append(h("p", { class: "note" }, L.note));
  const g = (GEN[key] ||= { preset: "hand", a: 0, r: 0, round: true, ylog: L.log });
  const chartBox = h("div", { class: "chart" });
  const controls = h("div", { class: "controls" });
  card.append(h("div", { class: "row" }, chartBox, controls));

  // controls: preset, baseline, rate
  const presetSel = h("select", { onchange: (e) => {
    g.preset = e.target.value;
    if (g.preset !== "hand") { const [a, r] = PRESETS[g.preset].fit(listValues(L)); g.a = sig(a, 4); g.r = sig(r, 4); applyGen(key, L); }
    render();
  } }, Object.entries(PRESETS).map(([k, p]) => h("option", { value: k, selected: k === g.preset }, p.name)));
  controls.append(h("label", {}, "Preset", presetSel));
  if (g.preset !== "hand") {
    const P = PRESETS[g.preset];
    const num = (label, prop, step) => h("label", {}, label, h("input", { type: "number", value: g[prop], step, onchange: (e) => { g[prop] = +e.target.value; applyGen(key, L); render(); } }));
    controls.append(num("Baseline (first value)", "a", "any"));
    controls.append(num(P.rate, "r", "any"));
    const rr = h("input", { type: "range", min: -100, max: 100, value: 0 });
    const base = g.r;
    const spread = g.preset === "exp" ? 0.5 : Math.max(Math.abs(base), 0.5);
    rr.addEventListener("input", () => { g.r = sig(base + spread * (+rr.value / 100), 4); applyGen(key, L); redrawOnly(); });
    rr.addEventListener("change", render);
    controls.append(h("div", { class: "hint" }, "Drag to steepen or flatten the curve:"), rr);
    controls.append(h("label", {}, "Round to clean numbers", h("input", { type: "checkbox", checked: g.round, onchange: (e) => { g.round = e.target.checked; applyGen(key, L); render(); } })));
    controls.append(h("div", { class: "hint" }, `Last value: ${abbr(P.f(L.items.length - 1, g.a, g.r))}`));
  } else {
    controls.append(h("div", { class: "hint" }, "Pick a preset to fit a curve through these values, then change its baseline and growth. Or drag the dots on the graph."));
  }
  const scale = h("input", { type: "number", value: 1, step: 0.05, style: "width:70px" });
  controls.append(h("label", {}, "Multiply all by", h("span", {}, scale, " ", h("button", { class: "small", onclick: () => {
    const k = +scale.value; if (!(k > 0)) return; g.preset = "hand";
    listValues(L).forEach((v, i) => setItem(L, i, sig(v * k, L.sig))); render();
  } }, "Apply"))));

    h("button", { class: "small", onclick: () => { g.ylog = !g.ylog; redrawOnly(); } }, "Log / linear scale"),

      series: [
        { name: "In the game now", color: css("--ink3"), dash: true, dots: false, pts: old.map((y, i) => ({ y, label: L.items[i].label })) },
        { name: "Your edit", color: css("--s1"), dots: true, drag: true, pts: now.map((y, i) => ({ y, label: L.items[i].label })) },
      ],

    });

  const tb = h("table", {}, h("tr", {}, h("th", {}, "Name"), h("th", {}, ""), h("th", {}, "In game"), h("th", {}, "New"), h("th", {}, "Change")));
  L.items.forEach((it, i) => {
    const d = pct(vals[i], old[i]);
    tb.append(h("tr", {},
      h("td", {}, h("span", { class: "chip", style: `background:${it.color || "var(--ink3)"}` }), it.label),
      h("td", { style: "color:var(--ink2)" }, it.tag || ""),
      h("td", {}, abbr(old[i])),
      h("td", {}, h("input", { type: "number", value: +vals[i].toPrecision(6), step: "any", onchange: (e) => { g.preset = "hand"; setItem(L, i, +e.target.value); render(); } })),
      h("td", { class: Math.abs(d) < 0.05 ? "" : d > 0 ? "up" : "down" }, Math.abs(d) < 0.05 ? "" : (d > 0 ? "+" : "") + d.toFixed(0) + "%")));
  });
  det.append(tb);

function formulaCard(key, F) {

  card.append(h("h2", {}, F.title, changed ? h("span", { class: "changed" }, "edited") : null));

    } else {
      input = h("input", { type: "number", value: cur(P.path), step: P.step || "any", oninput: (e) => { if (e.target.value !== "") { setVal(P.path, +e.target.value); draw(); } }, onchange: render });

      series = [

        { name: "Your edit", color: css("--s1"), pts: xs.map((x) => ({ x, y: F.f(x, cur) })) },
      ];
      if (F.dots) series.push({ name: "Pets", color: css("--s2"), line: false, dots: true, pts: F.dots(cur).map((d) => ({ x: d.x, y: F.f(d.x, cur), label: d.label })) });

    tableBox.innerHTML = "";

    if (rows) {
      const tb = h("table", {}, h("tr", {}, h("th", {}, F.marks ? F.xLabel : ""), h("th", {}, ""), h("th", {}, "In game"), h("th", {}, "New")));
      rows.forEach(([a, o, n]) => tb.append(h("tr", {}, h("td", {}, a), h("td", {}), h("td", {}, abbr(o) + (F.marks ? "x" : "")), h("td", {}, abbr(n) + (F.marks ? "x" : "")))));

    const S = ASSUME.strength[i] || 0;
    const dps = weaponDps(wid, g) * pDamage(S, P) * pSpeed(S, P);
    const hp = Math.max(...tierBosses(t).map((b) => g(`Bosses.${b}.Health`)));
    const ground = CFG.Training.Grounds[t[0]];
    const mob = ground ? g(`Training.Grounds.${t[0]}.Health`) : null;
    const kinds = CFG.Eggs.Kinds[t[0]] || {};
    const wsum = Object.values(kinds).reduce((a, b) => a + b, 0) || 1;
    const avgCash = Object.entries(kinds).reduce((a, [k, w]) => a + w * (g(`Pets.${k}.Cash`) || 0), 0) / wsum;
    const income = avgCash * ASSUME.pens;
    const next = TIERS[i + 1];
    const nextCost = next ? g(`Regions.Cost.${next[0]}`) : null;
    return { label: tierName(t), weapon: CFG.Weapons[wid].Name, S, dps, hp, fight: hp / dps, mob: mob ? mob / dps : null, income, save: nextCost ? nextCost / income / 60 : null, nextCost };
  });
  // assumptions
  const card0 = h("section", { class: "card" }, h("h2", {}, "Assumptions"),
    h("p", { class: "note" }, "A rough solo player: on arriving in a region they own the best weapon that costs no more than that region did, have this much Strength, and fill their 5 pens with that region's eggs (average by egg odds). Change the Strength guesses to see how fights feel at different points."));
  const as = h("div", { class: "assume" });
  TIERS.forEach((t, i) => as.append(h("label", {}, tierName(t) + " ", h("input", { type: "number", value: ASSUME.strength[i], onchange: (e) => { ASSUME.strength[i] = +e.target.value; render(); } }))));
  card0.append(as);
  out.push(card0);

  const c1 = h("section", { class: "card" }, h("h2", {}, "Seconds to kill, solo"),
    h("p", { class: "note" }, "Boss health / your damage a second, and the same for one training mob. Under ~10s feels trivial, over ~60s solo means you'll want friends."));
  const b1 = h("div", { class: "chart" }); c1.append(b1); out.push(c1);
  const c2 = h("section", { class: "card" }, h("h2", {}, "Minutes of pen income to afford the next region"),
    h("p", { class: "note" }, "The next region's price / (5 pens of this region's average pet). Boss bounties and egg rewards speed this up."));
  const b2 = h("div", { class: "chart" }); c2.append(b2); out.push(c2);
  const c3 = h("section", { class: "card" }, h("h2", {}, "By region"));
  const tb = h("table", {}, h("tr", {}, ...["Region", "Weapon", "Strength", "Your dps", "Boss health", "Boss fight", "Mob kill", "Pen income", "Save for next"].map((x) => h("th", {}, x))));
  rows.forEach((r) => tb.append(h("tr", {}, h("td", {}, r.label), h("td", {}, r.weapon), h("td", {}, abbr(r.S)), h("td", {}, abbr(r.dps)), h("td", {}, abbr(r.hp)),
    h("td", {}, abbr(r.fight) + "s"), h("td", {}, r.mob == null ? "–" : abbr(r.mob) + "s"), h("td", {}, abbr(r.income) + "/s"), h("td", {}, r.save == null ? "–" : abbr(r.save) + " min"))));
  c3.append(tb); out.push(c3);
  requestAnimationFrame(() => {
    const cats = rows.map((r) => r.label);
    drawChart(b1, { xCat: cats, yLog: true, series: [
      { name: "Boss fight", color: css("--s1"), dots: true, pts: rows.map((r) => ({ y: r.fight })) },
      { name: "Training mob", color: css("--s2"), dots: true, pts: rows.map((r) => ({ y: r.mob == null ? NaN : r.mob })) },
    ] });
    drawChart(b2, { xCat: cats.slice(0, -1), yLog: true, series: [
      { name: "Minutes", color: css("--s3"), dots: true, pts: rows.slice(0, -1).map((r) => ({ y: r.save })) },
    ] });
  });
  return out;
}

// ---------------------------------------------------------------- page
function editedOn(pg) {
  const paths = new Set();
  for (const L of Object.values(lists())) if (L.page === pg) L.items.forEach((it) => it.targets.forEach((p) => paths.add(p)));
  for (const F of Object.values(formulas())) if (F.page === pg) F.params.forEach((p) => paths.add(p.path));
  return [...paths].some((p) => p in EDIT);
}
function render() {
  if (!CFG) return;
  const y = window.scrollY;
  const nav = $("#nav"); nav.innerHTML = "";
  for (const [name] of PAGES) nav.append(h("a", { class: name === page ? "on" : "", onclick: () => { page = name; render(); window.scrollTo(0, 0); } }, name, editedOn(name) ? h("span", { class: "dot", title: "edited" }) : null));
  nav.append(h("p", {}, "Edits stay on this page until you press Save to game. Saving writes only the values you changed into Config.luau."));
  const main = $("#main"); main.innerHTML = "";
  main.append(h("p", { class: "intro" }, PAGES.find((p) => p[0] === page)[1]));
  if (page === "Pacing") { pacingCards().forEach((c) => main.append(c)); }
  else {
    const L = lists(), F = formulas();
    Object.values(L).forEach(usable);
    const addLists = () => { for (const [k, l] of Object.entries(L)) if (l.page === page && l.items.length) main.append(listCard(k, l)); };
    const addFormulas = () => { for (const [k, f] of Object.entries(F)) if (f.page === page) main.append(formulaCard(k, f)); };
    if (page === "Strength") { addFormulas(); addLists(); } else { addLists(); addFormulas(); } // (on Strength the curves matter most)
  }
  window.scrollTo(0, y);
}
function refreshStatus() {
  const n = Object.keys(EDIT).length;
  $("#save").disabled = !n;
  $("#status").textContent = n ? `${n} value${n === 1 ? "" : "s"} changed, not saved yet` : "Matches the game";
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 5000); }

async function load() {
  const r = await fetch("/config", { cache: "no-store" });
  if (!r.ok) { $("#status").textContent = await r.text(); return; }
  const j = await r.json();
  CFG = j.tree; PATHS = j.paths; VERSION = j.version;
  for (const p of Object.keys(EDIT)) if (!(p in PATHS)) delete EDIT[p];
  refreshStatus(); render();
}
$("#save").addEventListener("click", async () => {
  const btn = $("#save"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    const r = await fetch("/save", { method: "POST", body: JSON.stringify({ edits: EDIT, base: VERSION }) });
    const text = await r.text();
    if (!r.ok) { toast(text); return; }
    const j = JSON.parse(text);
    for (const k of Object.keys(EDIT)) delete EDIT[k];
    for (const k of Object.keys(GEN)) GEN[k].preset = "hand";
    toast(`${j.count} value${j.count === 1 ? "" : "s"}. ${j.message}`);
    await load();
  } catch (e) { toast("Couldn't reach the dashboard's server. Is it still running?"); }
  finally { btn.textContent = "Save to game"; refreshStatus(); }
});
$("#resetAll").addEventListener("click", () => { for (const k of Object.keys(EDIT)) delete EDIT[k]; for (const k of Object.keys(GEN)) GEN[k].preset = "hand"; refreshStatus(); render(); });
window.addEventListener("beforeunload", (e) => { if (Object.keys(EDIT).length) { e.preventDefault(); e.returnValue = ""; } });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
load();
</script>
