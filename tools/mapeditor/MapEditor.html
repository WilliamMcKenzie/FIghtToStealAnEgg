<title>World Map Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a full-screen canvas with the map, a tool rail on the left, a palette tray along the
   bottom, and an inspector on the right; dark slate panels lit warm on top, cool below (QM's UI). */
:root {
  color-scheme: dark;
  --ink: #0e1218;
  --panel-top: #3a3640;
  --panel-bottom: #1b2230;
  --panel-edge: #0a0d13;
  --well: #121822;
  --text: #f4f1ea;
  --muted: #a3acbd;
  --accent: #ffcc4d;
  --accent-deep: #e0912b;
  --danger: #ff5a4e;
  --ok: #7fd36b;
  --display: "Montserrat", "Arial Black", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --outline: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 2px 0 #000;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--text); font: 600 13px/1.35 var(--display); overflow: hidden; user-select: none; -webkit-user-select: none; }
button, input, select { font: inherit; color: inherit; }
.panel { background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom)); border: 2px solid var(--panel-edge); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); }
.title { font-weight: 800; text-shadow: var(--outline); letter-spacing: .02em; }
.label { font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#app { position: fixed; inset: 0; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto 1fr auto; gap: 8px;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
#app > * { pointer-events: auto; min-width: 0; }
#view { position: fixed; inset: 0; display: block; touch-action: none; }
#top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 8px; }
#top h1 { font-size: 17px; margin: 0 8px 0 4px; white-space: nowrap; }
#top h1 small { font-size: 11px; color: var(--accent); margin-left: 6px; }
#file { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 2px solid var(--panel-edge); cursor: pointer;
  background: linear-gradient(180deg, #5a5560, #2b3242); font-weight: 800; text-shadow: var(--outline); white-space: nowrap; }
.btn:hover { filter: brightness(1.15); }
.btn:focus-visible, .tool:focus-visible, .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.gold { background: linear-gradient(180deg, #ffd866, #d9822b 60%, #a8541f); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
#rail { grid-row: 2; display: flex; flex-direction: column; gap: 6px; padding: 6px; align-self: start; }
.tool { width: 42px; height: 42px; border-radius: 8px; border: 2px solid var(--panel-edge); background: linear-gradient(180deg, #4b4752, #232a38); cursor: pointer; display: grid; place-items: center; position: relative; }
.tool svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 0 #000); }
.tool.on { background: linear-gradient(180deg, #ffd866, #d9822b 60%, #a8541f); }
.tool.on svg { stroke: #fff; }
.tool .k { position: absolute; right: 2px; bottom: 0; font-size: 9px; color: var(--muted); font-family: var(--mono); }
.tool.on .k { color: #3a1d06; }
.sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.size { height: 20px; border-radius: 5px; border: 2px solid var(--panel-edge); background: var(--well); cursor: pointer; font-size: 10px; font-family: var(--mono); padding: 0; }
.size.on { background: var(--accent-deep); color: #fff; }
#side { grid-row: 2; grid-column: 3; width: 250px; display: flex; flex-direction: column; gap: 8px; align-self: start; max-height: 100%; overflow: auto; }
#side section { padding: 10px; display: grid; gap: 8px; }
#side h2 { margin: 0; font-size: 14px; }
.row { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 6px; }
.row input, .row select { width: 100%; min-width: 0; background: var(--well); border: 1px solid #000; border-radius: 6px; padding: 5px 7px; font-family: var(--mono); font-size: 12px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.checks label { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
.note { color: var(--muted); font-size: 12px; font-weight: 600; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 800; background: var(--well); }
.pill.bad { background: var(--danger); color: #fff; text-shadow: var(--outline); }
.pill.good { background: #2d5a2a; color: var(--ok); }
#tray { grid-column: 1 / -1; grid-row: 3; padding: 6px 8px 8px; display: grid; gap: 6px; }
.tabs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tab { padding: 4px 10px; border-radius: 6px; border: 2px solid var(--panel-edge); background: var(--well); cursor: pointer; font-weight: 800; }
.tab.on { background: linear-gradient(180deg, #ffd866, #d9822b); text-shadow: var(--outline); }
#swatches { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
.group { display: flex; flex-direction: column; gap: 4px; }
.group .label { padding-left: 2px; }
.group .items { display: flex; gap: 4px; }
.sw { width: 52px; border-radius: 7px; border: 2px solid var(--panel-edge); background: var(--well); cursor: pointer; padding: 3px 3px 2px; display: grid; justify-items: center; gap: 1px; }
.sw canvas, .sw img { width: 42px; height: 42px; image-rendering: pixelated; border-radius: 4px; object-fit: contain; }
.sw span { font-size: 9px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48px; }
.sw.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-deep); }
.crow { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; cursor: pointer; }
.crow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow input[type=color] { width: 30px; height: 22px; padding: 0; border: 2px solid var(--panel-edge); border-radius: 5px; background: none; cursor: pointer; }
.mini { font-size: 10px; padding: 2px 6px; border-radius: 5px; border: 1px solid #000; background: var(--well); cursor: pointer; }
.cgroup { display: grid; gap: 3px; min-width: 190px; padding: 4px 6px; background: var(--well); border-radius: 7px; align-content: start; }
#cfilter { background: var(--well); border: 1px solid #000; border-radius: 6px; padding: 4px 8px; width: 160px; }
.scale { display: grid; grid-template-columns: 1fr 58px; gap: 6px; align-items: center; }
.scale input[type=range] { width: 100%; accent-color: var(--accent); }
#status { position: fixed; left: max(80px, calc(env(safe-area-inset-left, 0px) + 80px)); bottom: 150px; font-family: var(--mono); font-size: 12px; padding: 4px 8px; background: rgba(10,13,19,.8); border-radius: 6px; pointer-events: none; }
#toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 8px 12px; z-index: 5; max-width: calc(100% - 32px); }
#drop { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,13,19,.75); font-size: 24px; z-index: 6; pointer-events: none; }
@media (max-width: 720px) {
  #app { grid-template-columns: auto 1fr; }
  #side { grid-column: 1 / -1; grid-row: 4; width: auto; max-height: 30vh; }
  #status { bottom: auto; top: 110px; }
  #file { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="view"></canvas>
<div id="app">
  <header id="top" class="panel">
    <h1 class="title">World Map Editor<small>.map</small></h1>
    <span id="file">world.map</span>
    <span class="spacer"></span>
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button class="btn" id="open" title="Open a .map file (or drop one on the page)">Open .map</button>
    <button class="btn gold" id="save" title="Download the map to send over">Download .map</button>
    <input type="file" id="picker" accept=".map,.json,.txt,application/json,text/plain" hidden>
  </header>

  <nav id="rail" class="panel" aria-label="Tools">
    <button class="tool on" data-tool="paint" title="Paint tiles (B)"><svg viewBox="0 0 24 24"><path d="M4 20c3 0 5-2 5-4.5S7.5 12 6 13.5 4 17 4 20z"/><path d="M9 15l10-10 2 2-10 10"/></svg><span class="k">B</span></button>
    <button class="tool" data-tool="rect" title="Fill a rectangle (U)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg><span class="k">U</span></button>
    <button class="tool" data-tool="fill" title="Flood fill a patch (G)"><svg viewBox="0 0 24 24"><path d="M5 11l7-7 7 7-7 7z"/><path d="M19 15c0 2 1 3 1 4a1 1 0 0 1-2 0c0-1 1-2 1-4z"/></svg><span class="k">G</span></button>
    <button class="tool" data-tool="pick" title="Pick a tile from the map (I, or Alt+click)"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/></svg><span class="k">I</span></button>
    <button class="tool" data-tool="select" title="Select and move objects (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><span class="k">V</span></button>
    <button class="tool" data-tool="place" title="Place the object chosen in the tray (P)"><svg viewBox="0 0 24 24"><path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><span class="k">P</span></button>
    <button class="tool" data-tool="pan" title="Pan (H, or drag with right or middle mouse, or hold Space)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span class="k">H</span></button>
    <div class="label" style="text-align:center;margin-top:4px">Brush</div>
    <div class="sizes" id="sizes"></div>
  </nav>

  <aside id="side">
    <section class="panel" id="inspect"></section>
    <section class="panel">
      <h2 class="title">View</h2>
      <div class="checks" id="checks"></div>
      <div class="note">Layered rule: <span id="rule" class="pill">…</span></div>
    </section>
  </aside>

  <footer id="tray" class="panel">
    <div class="tabs">
      <button class="tab on" data-tab="tiles">Floor</button>
      <button class="tab" data-tab="objects">Objects</button>
      <button class="tab" data-tab="colours">Colours</button>
      <input id="cfilter" type="search" placeholder="Filter colours" hidden>
      <span class="spacer"></span>
      <label class="note" id="stylebox" hidden>Style <select id="style"></select></label>
      <button class="btn" id="newtile" title="Add a tile: a colour and a height">+ New tile</button>
    </div>
    <div id="swatches"></div>
  </footer>
</div>
<div id="status"></div>
<div id="toast" class="panel" hidden></div>
<div id="drop" class="title" hidden>Drop the .map to open it</div>

// ---------------------------------------------------------------------------------------------
// World Map Editor (QM, Oct 24): paints the game's .map (maps/world.map in the repo). Each cell
// is one 4-stud checker square; colours, studs and the meshes' top-down pictures match the game
// seen from straight above. Walls, pillars, arches and barriers are fixed (tools/map_gen.py).
// ---------------------------------------------------------------------------------------------
const DEFAULTS = BUNDLE.colours; // Config.WorldColors (and the eggs'), as the game has them
let C = Object.assign({}, DEFAULTS); // with the map's own colours over them (M.colours)
const STUD_ALPHA = 1 - BUNDLE.studTransparency;
const LIP = 0.25;
const $ = (id) => document.getElementById(id);
const cv = $("view"), ctx = cv.getContext("2d");
const layer = document.createElement("canvas"), lctx = layer.getContext("2d");

// ---- state ------------------------------------------------------------------------------------
let M = null;          // the map: {head, tiles, areas, objects, fixed, origin, cell, cols, rows}
let cells = null;      // Uint8Array: 0 no floor, k = tiles[k - 1]
let fileName = "world.map";
let tool = "paint", brush = 2, current = 1, placing = null, selected = null;
let cam = { x: 0, z: -300, zoom: 1.2 };
const view = { studs: true, edges: true, fixed: true, arches: true, furniture: true, props: true, barriers: true, labels: true, rule: true, flip: false };
const undoStack = [], redoStack = [];
let dirty = true, bad = [];

const rgb = (k) => C[k] || [255, 0, 255];
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const shade = (c, f) => c.map((v) => Math.max(0, Math.min(255, Math.round(v * f))));

// ---- the .map file ----------------------------------------------------------------------------
function parseMap(text) {
  const d = JSON.parse(text);
  if (d.format !== "StealAndFightPets.map") throw new Error("That isn't a .map file from this game.");
  const [cols, rows] = d.size;
  if (!Array.isArray(d.rows) || d.rows.length !== rows) throw new Error("The map's rows don't match its size.");
  const idx = {};
  d.tiles.forEach((t, i) => (idx[t.id] = i + 1));
  const g = new Uint8Array(cols * rows);
  for (let r = 0; r < rows; r++) {
    const row = d.rows[r];
    for (let c = 0; c < cols; c++) g[r * cols + c] = idx[row[c]] || 0;
  }
  const head = {};
  for (const k of Object.keys(d)) if (!["tiles", "areas", "objects", "fixed", "rows", "colours"].includes(k)) head[k] = d[k];
  return { m: { head, colours: d.colours || {}, tiles: d.tiles, areas: d.areas, objects: d.objects, fixed: d.fixed, origin: d.origin, cell: d.cell, cols, rows }, g };
}

function dumpMap() {
  const ids = M.tiles.map((t) => t.id);
  const rows = [];
  for (let r = 0; r < M.rows; r++) {
    let s = "";
    for (let c = 0; c < M.cols; c++) { const k = cells[r * M.cols + c]; s += k ? ids[k - 1] : "."; }
    rows.push(s);
  }
  const head = Object.assign({}, M.head, { saved: new Date().toISOString().slice(0, 19) + "Z" });
  const out = [JSON.stringify(head).slice(0, -1) + ","];
  // the colours QM changed from Config's: { ColorKey: [r, g, b] }, baked over Config.WorldColors
  const cols = Object.keys(M.colours).sort();
  out.push('"colours": {');
  out.push(cols.map((k) => `  "${k}": ${JSON.stringify(M.colours[k])}`).join(",\n"));
  out.push("},");
  for (const k of ["areas", "tiles", "objects"]) {
    out.push(`"${k}": [`);
    out.push(M[k].map((v) => "  " + JSON.stringify(v)).join(",\n"));
    out.push("],");
  }
  out.push('"fixed": {');
  const f = Object.entries(M.fixed);
  f.forEach(([k, v], n) => {
    const comma = n < f.length - 1 ? "," : "";
    if (Array.isArray(v)) { out.push(`  "${k}": [`); out.push(v.map((x) => "    " + JSON.stringify(x)).join(",\n")); out.push("  ]" + comma); }
    else out.push(`  "${k}": ${JSON.stringify(v)}${comma}`);
  });
  out.push("},");
  out.push('"rows": [');
  out.push(rows.map((r) => `"${r}"`).join(",\n"));
  out.push("]}");
  return out.join("\n") + "\n";
}

function load(text, name, quiet) {
  const { m, g } = parseMap(text);
  M = m; cells = g; fileName = name || "world.map";
  C = Object.assign({}, DEFAULTS, M.colours);
  $("file").textContent = fileName;
  undoStack.length = redoStack.length = 0;
  selected = null; current = Math.min(current, M.tiles.length);
  buildCellImages(); checkRule(); buildTray(); inspect(); updateUndo();
  if (!quiet) toast(`Opened ${fileName}`);
  dirty = true;
}

// ---- geometry -----------------------------------------------------------------------------------
const X0 = () => M.origin[0], Z0 = () => M.origin[1];
function cellAt(x, z) {
  const c = Math.floor((x - X0()) / M.cell), r = Math.floor((z - Z0()) / M.cell);
  return c >= 0 && r >= 0 && c < M.cols && r < M.rows ? r * M.cols + c : -1;
}
const tileOf = (i) => (i >= 0 && cells[i] ? M.tiles[cells[i] - 1] : null);
// which checker colour a cell wears: the game's checker texture is lined up with the world grid
function isChecker(c, r) {
  const ix = X0() / M.cell + c, iz = Z0() / M.cell + r;
  return (((ix + iz) % 2) + 2) % 2 === (view.flip ? 1 : 0);
}
function biomeAt(z) {
  for (const a of M.areas) if (a.bounds && z <= a.bounds[1] && z > a.bounds[3]) return a.name;
  return "Base";
}
function areaAt(x, z) { const t = tileOf(cellAt(x, z)); return t ? t.area : biomeAt(z); }
function groundAt(x, z) { const t = tileOf(cellAt(x, z)); return t ? t.top : M.fixed.wallHeight; }

// ---- cell pictures: one pixel a cell (solid tiles, and liquids, which have no studs) ----------
let solidCv, liquidCv, solidImg, liquidImg;
function buildCellImages() {
  solidCv = document.createElement("canvas"); liquidCv = document.createElement("canvas");
  solidCv.width = liquidCv.width = M.cols; solidCv.height = liquidCv.height = M.rows;
  solidImg = solidCv.getContext("2d").createImageData(M.cols, M.rows);
  liquidImg = liquidCv.getContext("2d").createImageData(M.cols, M.rows);
  paintCells(0, 0, M.cols - 1, M.rows - 1);
}
function paintCells(c0, r0, c1, r1) {
  c0 = Math.max(0, c0); r0 = Math.max(0, r0); c1 = Math.min(M.cols - 1, c1); r1 = Math.min(M.rows - 1, r1);
  const cache = M.tiles.map((t) => [rgb(t.key), C[t.key + "Checker"] || rgb(t.key)]);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const i = r * M.cols + c, k = cells[i], p = i * 4;
    const t = k ? M.tiles[k - 1] : null;
    const into = t && t.liquid ? liquidImg.data : solidImg.data, other = into === solidImg.data ? liquidImg.data : solidImg.data;
    other[p + 3] = 0;
    if (!t) { into[p + 3] = 0; continue; }
    const col = cache[k - 1][isChecker(c, r) ? 1 : 0];
    into[p] = col[0]; into[p + 1] = col[1]; into[p + 2] = col[2]; into[p + 3] = 255;
  }
  solidCv.getContext("2d").putImageData(solidImg, 0, 0);
  liquidCv.getContext("2d").putImageData(liquidImg, 0, 0);
  dirty = true;
}

// QM's layered rule: no two touching cells (diagonals too) more than a step apart
function checkRule() {

    colourList(box, o.type === "Ruin" ? (o.style === "Base" ? ["Stone", "StoneDark"] : [o.style + "Pillar", o.style + "PillarDark"]) : spr ? spr.keys : [], "Its colours");
    return;
  }
  if (tool === "place" && placing) {
    h.textContent = "Placing: " + (placing.label || placing.type);
    const n = document.createElement("div"); n.className = "note";
    n.textContent = placing.type === "Boss" ? "Click in a biome to move its boss there." : "Click the map to place one. Style picks the stone's colours (Auto: the area it's in).";
    box.appendChild(n);
    const spr = placing.type === "Prop" ? (sprites[placing.item] || sprites[placing.item + "_" + ($("style").value || "Meadow")]) : placing.type === "Nest" ? sprites.Nest_Meadow : null;
    if (spr) colourList(box, spr.keys, "Its colours");
    return;
  }
  const t = current ? M.tiles[current - 1] : null;
  if (!t) { h.textContent = "No floor"; const n = document.createElement("div"); n.className = "note"; n.textContent = "Paints cells away, as under the walls. Props on them stand at wall height."; box.appendChild(n); return; }
  h.textContent = t.key;
  let count = 0; for (let i = 0; i < cells.length; i++) if (cells[i] === current) count++;
  const n0 = document.createElement("div"); n0.className = "note"; n0.textContent = `${t.area} tile · ${count} cells (${count * 16} studs²)`; box.appendChild(n0);
  const editTile = (k) => (v) => editTiles(() => { const tt = M.tiles[current - 1]; if (v === null || v === false) delete tt[k]; else tt[k] = v; });
  box.appendChild(field("Colour", t.key, editTile("key"), BUNDLE.keys));
  box.appendChild(field("Top", t.top, editTile("top")));
  box.appendChild(field("Liquid", t.liquid ? "yes" : "no", (v) => editTile("liquid")(v === "yes"), ["no", "yes"]));
  box.appendChild(field("Area", t.area, editTile("area"), M.areas.map((a) => a.name)));
  const n = document.createElement("div"); n.className = "note";
  n.textContent = "Top is the floor's height in studs. Changing it moves every cell of this tile.";
  box.appendChild(n);
  colourList(box, [t.key, t.key + "Checker"], "Its colours");
}
$("newtile").onclick = () => {
  const base = current ? M.tiles[current - 1] : M.tiles[0];
  const used = new Set(M.tiles.map((t) => t.id));
  const id = [..."abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!#$%&()*+-/:;<=>?@^_`{|}~"].find((c) => !used.has(c));
  if (!id) return toast("That's every tile the format has room for.");
  editTiles(() => M.tiles.push({ id, area: base.area, key: base.key, top: base.top + 1 }));
  current = M.tiles.length; buildTray(); inspect();
  toast("Added a tile a step higher: set its colour and height on the right.");
};

const checkDefs = [["studs", "Studs"], ["edges", "Height edges"], ["fixed", "Walls, pillars"], ["arches", "Arches"], ["props", "Props, ruins"], ["furniture", "Fences, pads"], ["barriers", "Barriers"], ["labels", "Labels"], ["rule", "Rule check"], ["flip", "Flip checker"]];
for (const [k, label] of checkDefs) {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" id="v-${k}"${view[k] ? " checked" : ""}> ${label}`;
  l.querySelector("input").onchange = (e) => { view[k] = e.target.checked; if (k === "flip") paintCells(0, 0, M.cols - 1, M.rows - 1); dirty = true; };
  $("checks").appendChild(l);
}

// ---- files -------------------------------------------------------------------------------------------
let toastTimer;
function toast(msg, actions) {
  const t = $("toast"); t.innerHTML = ""; const s = document.createElement("span"); s.textContent = msg; t.appendChild(s);
  for (const [label, f] of actions || []) { const b = document.createElement("button"); b.className = "btn"; b.textContent = label; b.onclick = () => { t.hidden = true; f(); }; t.appendChild(b); }
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), actions ? 9000 : 3200);
}
const DRAFT = "world-map-editor-draft";
let draftTimer;
function changed() {
  dirty = true;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { try { localStorage.setItem(DRAFT, JSON.stringify({ name: fileName, text: dumpMap(), at: Date.now() })); } catch (e) { /* (a draft is a convenience) */ } }, 800);
}
async function download() {
  if (!M) return;
  const text = dumpMap();
  let downloads = null;
  try { downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { downloads = null; }
  if (downloads) {
    // (the viewer only saves known types: a .map is JSON, so it goes as .map.json)
    const name = fileName.replace(/\.json$/, "").replace(/\.map$/, "") + ".map.json";
    try { await downloads.save({ filename: name, data: new Blob([text], { type: "application/json" }) }); toast(`Saved ${name}. Send it over to go in the game.`); }
    catch (e) { if (e && e.code !== "declined") toast("The download didn't go through: " + (e.message || e.code)); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = fileName.endsWith(".map") ? fileName : "world.map";
  document.body.appendChild(a); a.click(); a.remove();
  toast(`Saved ${a.download}. Send it over to go in the game.`);
}
$("save").onclick = download;
$("undo").onclick = undo; $("redo").onclick = redo;
$("open").onclick = () => $("picker").click();
function openFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { load(String(r.result), file.name.replace(/\.json$/, "")); } catch (e) { toast(e.message || "Couldn't read that file."); } };
  r.readAsText(file);
}
$("picker").onchange = (e) => { openFile(e.target.files[0]); e.target.value = ""; };
window.addEventListener("dragover", (e) => { e.preventDefault(); $("drop").hidden = false; });
window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) $("drop").hidden = true; });
window.addEventListener("drop", (e) => { e.preventDefault(); $("drop").hidden = true; openFile(e.dataTransfer.files[0]); });

// ---- start -------------------------------------------------------------------------------------------
window.addEventListener("resize", resize);
resize(); buildSizes();
load(BUNDLE.map, "world.map", true);
try {
  const d = JSON.parse(localStorage.getItem(DRAFT) || "null");
  if (d && d.text && d.text !== BUNDLE.map) {
    const original = BUNDLE.map;
    load(d.text, d.name, true);
    toast(`Picked up your unsaved edits from ${new Date(d.at).toLocaleString()}.`, [["Start from the game's map", () => { load(original, "world.map", true); try { localStorage.removeItem(DRAFT); } catch (e) { /* */ } }]]);
  }
} catch (e) { /* no draft */ }
// open on the base and the Meadow
cam = { x: 0, z: -180, zoom: Math.max(0.5, Math.min(2, H / 760)) };
(function frame() { if (dirty) draw(); requestAnimationFrame(frame); })();
</script>
